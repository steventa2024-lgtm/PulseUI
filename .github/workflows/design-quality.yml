name: Design Quality Foundation

on:
  push:
    branches:
      - feat/design-quality-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Design and UX contract tests
        run: npm run test:quality

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
